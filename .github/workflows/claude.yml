name: Bug autónomo (ADR-0042)

# Dispara SOLO cuando un Issue tiene (o recibe) la etiqueta "bug" -- nunca
# en cualquier Issue nuevo. Es la válvula de seguridad manual: alguien
# (hoy Mathias, mañana quien triage) decide explícitamente que esto entra
# al pipeline autónomo poniendo esa etiqueta, en vez de que cualquier
# Issue dispare un agente con permisos de push a producción.
#
# También dispara ante un comentario nuevo en un Issue ya etiquetado
# "bug" (issue_comment) -- es como el agente retoma la conversación
# cuando responde una pregunta de clarificación que él mismo dejó. Dos
# guardas obligatorias en el `if` del job para evitar un loop infinito o
# ruido en PRs: (a) excluir comentarios del propio bot (`claude[bot]`) y
# (b) excluir comentarios en Pull Requests, que tècnicamente también
# emiten `issue_comment` en GitHub Actions.
on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]

concurrency:
  group: auto-fix-bug-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  auto-fix-bug:
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'bug')) ||
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request && github.event.issue.state == 'open' && contains(github.event.issue.labels.*.name, 'bug') && github.event.comment.user.login != 'claude[bot]')
    runs-on: ubuntu-latest
    # Un bug real de punta a punta (diagnóstico + fix + qa + review +
    # security gate si aplica + release en hasta 3 repos) puede tardar
    # bastante -- el límite es para cortar un run descarrilado, no para
    # apurar el trabajo real.
    timeout-minutes: 180
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository (reservas -- docs/, .claude/agents/, CLAUDE.md)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # persist-credentials: false (ADR-0042) -- por defecto este
          # step configura un header de auth global (token por defecto
          # de la Action, identidad "claude[bot]") que después pisa a
          # CROSS_REPO_PAT en cualquier `git push` plano contra los
          # clones hermanos de backend/frontend, aunque GH_TOKEN esté
          # bien seteado -- confirmado en vivo: `gh repo clone` siempre
          # funcionó (usa su propio auth), pero `git push` daba 403
          # "denied to claude[bot]" sin importar qué tuviera CROSS_REPO_PAT.
          persist-credentials: false

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          additional_permissions: |
            actions: read

          # CROSS_REPO_PAT (ADR-0042): un PAT propio, no el token por
          # defecto de esta Action, porque los comandos git/gh que corre
          # el agente vía la herramienta Bash necesitan autenticarse por
          # su cuenta contra Reservaste/backend y Reservaste/frontend --
          # dos repos que este workflow, corriendo en Reservaste/reservas,
          # no toca de otra forma. Sin esto, cualquier `git push`/`gh pr
          # create` contra backend o frontend falla.
          claude_args: |
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,Task,TodoWrite,WebFetch,WebSearch"
          prompt: |
            Actuás como Orchestrator/Tech Lead de este proyecto, exactamente
            el mismo rol descripto en CLAUDE.md (ya está en tu working
            directory, leelo primero -- junto con docs/architecture.md,
            docs/domain.md, docs/decisions.md y
            docs/agent-responsibilities.md). Esta corrida existe por
            ADR-0042 (docs/decisions.md): el usuario decidió sacarse del
            medio del ciclo de bugs -- delegás a los subagentes de
            `.claude/agents/` exactamente como en cualquier sesión
            interactiva, incluidos los gates obligatorios de
            `qa-engineer`, `reviewer`, y `security-engineer` cuando el
            cambio toca auth/RLS/multi-tenant/pagos. Nada de eso se relaja
            acá -- lo único que cambia es que no hay un humano esperando
            para aprobar el paso final.

            El disparador es el Issue #${{ github.event.issue.number }}
            de este repo (${{ github.repository }}), etiquetado "bug".
            Leé su título y cuerpo con `gh issue view ${{
            github.event.issue.number }} --repo ${{ github.repository }}
            --comments` (incluye comentarios, puede haber contexto
            adicional ahí). Si esta corrida arrancó por un comentario
            nuevo (evento `issue_comment`) en vez de por la etiqueta,
            es muy probable que sea la respuesta a una pregunta de
            clarificación que vos mismo dejaste en una corrida anterior
            -- leé el hilo completo de comentarios y seguí desde ahí en
            vez de repetir la misma pregunta.

            Estructura real del proyecto (tres repos separados, ADR-0016):
            este checkout es sólo `Reservaste/reservas` (docs + agentes).
            El código vive en `Reservaste/backend` y `Reservaste/frontend`.
            Clonalos como directorios hermanos de este mismo working
            directory (mismo layout que un checkout local: `../backend`,
            `../frontend` relativo a la raíz de este checkout, o
            `backend/`/`frontend/` si preferís clonarlos DENTRO de este
            working directory -- lo que sea más simple para vos, ambos
            layouts funcionan igual de bien siempre que backend y frontend
            queden como carpetas hermanas entre sí). Usá `gh repo clone
            Reservaste/backend` / `gh repo clone Reservaste/frontend` --
            `GH_TOKEN` ya está en el entorno (ver `env:` de este step) así
            que `gh`/`git push`/`git` sobre esos remotos no necesitan
            login aparte.

            CRÍTICO sobre delegar a subagentes (Task/Agent tool) en ESTA
            corrida: por defecto esa herramienta puede lanzar al subagente
            en background y decirte "vas a ser notificado cuando termine,
            mientras tanto seguí con otra cosa". Esa semántica asume que
            hay un turno futuro en el que la notificación te llega -- en
            una sesión interactiva sí lo hay. Acá NO: esta corrida es de
            un solo shot, el proceso entero termina en cuanto vos decidís
            que no tenés nada más que hacer, y si en ese momento quedó un
            subagente corriendo en background, su resultado se pierde para
            siempre -- nadie va a estar para leer esa notificación, el job
            ya cerró. Si alguna vez ves un mensaje tipo "Async agent
            launched" o "you will be notified automatically", NO lo
            tomes como "ya diste el paso, podés terminar": tenés que forzar
            modo foreground/síncrono en cada delegación a un subagente
            (`backend-engineer`, `frontend-engineer`, `qa-engineer`,
            `reviewer`, `security-engineer`, `release-manager`) -- pasá
            explícitamente la opción que lo bloquee hasta tener el
            resultado real (p. ej. `run_in_background: false` si la
            herramienta la expone) y no avances al paso siguiente ni
            termines tu respuesta hasta tener el resultado completo de
            cada subagente delegado, nunca sólo la confirmación de que
            arrancó.

            Flujo esperado, el mismo de siempre en este proyecto:
            1. Diagnosticá el bug con evidencia real (leé código, corré
               tests, no asumas) antes de tocar nada.
            2. Si el fix implica una decisión estructural (modelo de
               dominio, schema, auth, contratos de API, estrategia de
               slots/pagos/recurrencia -- ver la lista completa en
               CLAUDE.md) escribila como ADR nueva en docs/decisions.md
               ANTES de implementar, con el mismo detalle que las ADRs ya
               existentes en ese archivo -- seguís siendo vos quien decide
               (no hay humano que lo haga por vos en esta corrida), pero
               la decisión se registra igual.
            3. Delegá la implementación a `backend-engineer`/
               `frontend-engineer` según corresponda vía el mecanismo de
               subagentes normal (Task tool), SIEMPRE en foreground (ver
               nota crítica arriba) -- esperá su resultado completo antes
               de seguir.
            4. `qa-engineer` corre la suite de integración/unit completa
               del repo que tocaste, no sólo el archivo nuevo -- tiene que
               dar verde antes de seguir.
            5. `reviewer` revisa el diff con el checklist de siempre --
               LISTO/NO LISTO.
            6. Si el cambio toca auth, roles, RLS, aislamiento
               multi-tenant, IDOR, datos públicos/privados o pagos:
               `security-engineer` corre el gate -- LISTO/NO LISTO,
               obligatorio, sin excepción.
            7. Con todos los gates en verde: commiteá, pusheá a
               `development` del/los repo(s) que corresponda, mergeá a
               `main` vos mismo (`gh pr create` + `gh pr merge`, sin
               esperar aprobación humana -- ADR-0042). Si el repo backend
               tiene una migración de schema, el propio CI de ese repo la
               aplica sola a producción una vez que el push llega a
               `main` (el gate manual de GitHub Environment ya se sacó,
               ver ADR-0042) -- no necesitás (ni podés) aplicarla vos
               a mano.
            8. Documentá el bug + fix en
               `.claude/knowledge/curation-inbox.md` (si fue puntual) o
               como seguimiento de la ADR que escribiste en el paso 2 (si
               fue estructural), commiteá y pusheá esa parte en
               `Reservaste/reservas`.
            9. Comentá en el Issue #${{ github.event.issue.number }} (`gh
               issue comment`) un resumen breve en español de qué era el
               bug, qué se cambió, y los links de los commits/PRs. Cerrá
               el Issue (`gh issue close`) sólo si el fix ya quedó
               desplegado (o el push a `main` ya disparó el deploy
               automático) -- si algo quedó pendiente de verificar en
               producción, dejalo abierto y decilo en el comentario.

            El paso 9 NO es opcional ni condicional a que los pasos
            anteriores hayan salido bien: es tu ÚLTIMA acción en TODOS los
            casos, sin excepción, incluso si te quedaste a mitad de
            camino, un gate dio NO LISTO, o directamente no pudiste
            avanzar nada. Esta corrida no tiene una vuelta siguiente en la
            que alguien vea qué pasó si no lo contás ahora -- si tu
            respuesta final no incluye haber comentado en el Issue,
            trataste la corrida como si hubiera un humano que la va a
            revisar después, y no lo hay.

            Si en cualquier punto el bug no es reproducible, la
            información del Issue no alcanza para diagnosticarlo con
            confianza, o el fix requeriría una decisión que de verdad
            necesita al usuario (no una decisión estructural que podés
            registrar vos mismo como ADR, sino algo que depende de
            información que sólo él tiene -- ej. una preferencia de
            producto, no un hecho técnico) -- NO inventes ni asumas: comentá
            eso mismo en el Issue explicando qué falta, y dejalo abierto
            sin tocar código. Preferí no actuar antes que adivinar mal en
            un pipeline que ya no tiene revisión humana detrás.
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_PAT }}
